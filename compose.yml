services:
  flask-app:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Host user that owns cache/ and tokens.ini. The entrypoint fixes ownership, then runs the app as this user.
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - ./config.ini:/app/config.ini:ro
      - ./tokens.ini:/app/tokens.ini
      - ./cache:/app/cache
    restart: unless-stopped
